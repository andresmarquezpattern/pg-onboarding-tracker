<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&G Onboarding Tracker</title>
<style>
  :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --pattern:#f97316; --brand:#0ea5e9; --both:#8b5cf6; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --accent:#1d4ed8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); font-size:13.5px; }
  header { background:#0f172a; color:#fff; padding:14px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header .meta { font-size:12px; color:#94a3b8; }
  .btn { background:#1e293b; color:#e2e8f0; border:1px solid #334155; padding:6px 12px; border-radius:7px; font-size:12px; cursor:pointer; text-decoration:none; }
  .btn:hover { background:#334155; }
  .btn.orange { background:#f06a35; border-color:#f06a35; color:#fff; }
  .tabs { background:#1e293b; padding:0 28px; display:flex; gap:4px; }
  .tab { padding:12px 18px; font-size:13px; color:#94a3b8; border:none; background:none; border-bottom:3px solid transparent; cursor:pointer; }
  .tab.active { color:#fff; border-bottom-color:#6366f1; }
  main { max-width:1600px; margin:0 auto; padding:22px 28px; }
  .cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .card { flex:1; min-width:150px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .card .val { font-size:28px; font-weight:700; margin:4px 0 2px; }
  .card .sub { font-size:11.5px; color:var(--muted); }
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:18px; }
  .panel h2 { margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
  tr.click { cursor:pointer; } tr.click:hover td { background:#fafbfc; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill.ok { background:#d1fae5; color:#047857; } .pill.warn { background:#fef3c7; color:#b45309; } .pill.bad { background:#fee2e2; color:#b91c1c; } .pill.gray { background:#f1f5f9; color:#475569; } .pill.blue { background:#dbeafe; color:#1d4ed8; }
  .owner { display:inline-block; padding:1px 7px; border-radius:5px; font-size:10.5px; font-weight:600; color:#fff; }
  .owner.Pattern { background:var(--pattern);} .owner.Brand { background:var(--brand);} .owner.Both { background:var(--both);}
  .empty { padding:28px; text-align:center; color:var(--muted); background:#f8fafc; border:1px dashed var(--line); border-radius:10px; }
  .loading { display:flex; align-items:center; gap:10px; color:var(--muted); padding:40px 0; justify-content:center; }
  .spinner { width:18px; height:18px; border:3px solid var(--line); border-top-color:#6366f1; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg);} }
  /* Brand detail */
  .brand-head { display:flex; flex-wrap:wrap; gap:18px 32px; align-items:flex-start; }
  .brand-head .kv { font-size:12px; color:var(--muted); } .brand-head .kv b { display:block; color:var(--ink); font-size:14px; font-weight:600; margin-top:2px; }
  select.brand-sel { font-size:14px; padding:6px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; }
  /* Gantt */
  .gantt { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  .g-grid { display:grid; position:relative; min-width:100%; }
  .g-cell { border-bottom:1px solid #f1f5f9; padding:6px 10px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#fff; }
  .g-left { position:sticky; left:0; z-index:2; border-right:1px solid var(--line); }
  .g-head { position:sticky; top:0; z-index:3; background:#f8fafc; font-size:10.5px; color:var(--muted); text-align:center; padding:4px 0; border-bottom:1px solid var(--line); border-right:1px solid #f1f5f9; }
  .g-head.month { font-weight:600; color:var(--ink); text-align:left; padding-left:6px; }
  .g-cat { background:#f1f5f9; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#334155; }
  .g-track { position:relative; border-bottom:1px solid #f1f5f9; background:repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--day) - 1px), #f1f5f9 calc(var(--day) - 1px), #f1f5f9 var(--day)); }
  .g-bar { position:absolute; top:5px; height:18px; border-radius:5px; font-size:10.5px; line-height:18px; color:#fff; padding:0 6px; white-space:nowrap; overflow:hidden; opacity:.92; }
  .g-bar.Pattern { background:var(--pattern);} .g-bar.Brand { background:var(--brand);} .g-bar.Both { background:var(--both);}
  .g-bar.future { opacity:.45; } .g-bar.late { outline:2px solid var(--bad); outline-offset:-2px; }
  .g-bar.actual { background:#0f172a; opacity:.85; }
  .g-bar.actual.live { background:var(--ok); } .g-bar.actual.blocked { background:var(--bad); }
  .g-today { position:absolute; top:0; bottom:0; width:2px; background:var(--bad); z-index:1; }
  .g-today.lbl::after { content:'today'; position:absolute; top:-1px; left:4px; font-size:9.5px; color:var(--bad); font-weight:700; }
  .legend { display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin:8px 0 0; flex-wrap:wrap; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; }
  /* Token */
  #token-screen { display:none; position:fixed; inset:0; background:#0f172a; z-index:99; align-items:center; justify-content:center; padding:24px; }
  .token-card { background:#1e293b; border-radius:16px; padding:36px; max-width:460px; width:100%; text-align:center; color:#e2e8f0; }
  .token-card h2 { margin:0 0 8px; font-size:20px; } .token-card p { color:#94a3b8; font-size:13px; line-height:1.6; } .token-card a { color:#818cf8; }
  .token-card input { width:100%; padding:10px 12px; border:1px solid #334155; border-radius:8px; background:#0f172a; color:#fff; margin:12px 0; }
  .token-card button { width:100%; padding:10px; background:#6366f1; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

<div id="token-screen"><div class="token-card">
  <h2>🧴 P&amp;G Onboarding Tracker</h2>
  <p>Paste your <a href="https://app.asana.com/0/my-apps" target="_blank">Asana Personal Access Token</a> to load live data. It is stored only in this browser and only ever sent to Asana.</p>
  <input id="pat" type="password" placeholder="Asana PAT…" onkeydown="if(event.key==='Enter')saveToken()">
  <button onclick="saveToken()">Connect to Asana →</button>
</div></div>

<header>
  <div><h1>🧴 P&amp;G Onboarding Tracker</h1><div class="meta" id="meta">TikTok Shop · Procter &amp; Gamble portfolio</div></div>
  <div style="display:flex;gap:8px">
    <button class="btn" onclick="loadAll()">↻ Refresh</button>
    <button class="btn" onclick="clearToken()">⚙ Token</button>
    <a class="btn orange" target="_blank" href="https://app.asana.com/1/953966021734988/project/1213113488679843/list">↗ Asana</a>
  </div>
</header>
<div class="tabs">
  <button class="tab active" data-v="summary" onclick="showView('summary')">📊 Summary</button>
  <button class="tab" data-v="brand" onclick="showView('brand')">🏷 Brand detail</button>
  <button class="tab" data-v="roadmap" onclick="showView('roadmap')">🗺 Roadmap</button>
</div>

<main>
  <div class="loading" id="loading"><div class="spinner"></div><span id="loading-msg">Connecting to Asana…</span></div>
  <div id="view-summary" hidden></div>
  <div id="view-brand" hidden></div>
  <div id="view-roadmap" hidden></div>
</main>

<script>
/* ───────────── Config (Asana Onboarding 2026) ───────────── */
const ASANA = 'https://app.asana.com/api/1.0';
const OB_PROJECT = '1213113488679843';
const SECTIONS = [
  { id:'1213113488679845', name:'Signed – Day 0 Setup',        step:1 },
  { id:'1215733164073077', name:'Requirements Received',       step:1 },
  { id:'1213232688489800', name:'Routing & AM Assignment',     step:2 },
  { id:'1213232688489802', name:'Shop Build',                  step:2 },
  { id:'1213232688489804', name:'CQ + Brand Authorization',    step:3 },
  { id:'1215733164073088', name:'Product Listing - TTS',       step:4 },
  { id:'1217157171189256', name:'Product Listing - Shelf',     step:4 },
  { id:'1215733164073091', name:'Waiting for Inventory',       step:4, waiting:true },
  { id:'1216961114438443', name:'Account Health & CS Setup',   step:5 },
  { id:'1213899559338851', name:'Binding',                     step:5 },
  { id:'1213232688489805', name:'WAITING / BLOCKED',           step:0, blocked:true },
  { id:'1213232688489808', name:'Final Check / Live',          step:6, live:true },
  { id:'1217882963314457', name:'Churned Brands',              step:0, churned:true },
];
const CF = { brandName:'1213225017301320', brandType:'1213186691704359', salesRep:'1213225017301306', dateSigned:'1213225018306908', blockerOwner:'1213113488679866', workingStatus:'1215733164073073', onboardStatus:'1213187098790831' };
const TEMPLATE_PRIORITY = ['3p-existing-ein-transfer','1p-new-shop','1p-existing-subaccount','3p-new-shop'];

/* P&G detection: parent-ish custom field → parent task → intake form line → brand registry */
const PG_PATTERN = /p\s*&\s*g|procter/i;
const PG_BRANDS = ['Head & Shoulders','Secret','Old Spice','Olay','Gain','Tide','Pampers','Luvs','Gillette','Venus','Braun','Crest','Oral-B','Scope','Dawn','Cascade','Bounty','Charmin','Puffs','Febreze','Downy','Bounce','Swiffer','Mr. Clean','Pantene','Herbal Essences','Aussie','Native','Vicks','ZzzQuil','NyQuil','DayQuil','Pepto-Bismol','Metamucil','Prilosec','Align','Always','Tampax','SK-II','Safeguard','Ivory','Zevo','Nervive'];
const norm = s => (s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim();
const PG_NORM = PG_BRANDS.map(norm);
function cf(t, gid) { const f=(t.custom_fields||[]).find(c=>c.gid===gid); return f ? (f.display_value||f.text_value||null) : null; }
function parentCompany(t) {
  const f=(t.custom_fields||[]).find(c=>/parent/i.test(c.name||'')); const v=f?(f.display_value||f.text_value||''):'';
  if (v && PG_PATTERN.test(v)) return {company:'P&G', via:'field'};
  if (t.parent?.name && PG_PATTERN.test(t.parent.name)) return {company:'P&G', via:'parent task'};
  const m=/parent brand name[^\n]*\n\s*([^\n]+)/i.exec(t.notes||''); if (m && PG_PATTERN.test(m[1])) return {company:'P&G', via:'intake form'};
  const bn=norm(cf(t,CF.brandName)||t.name); if (bn && PG_NORM.some(b=>bn===b||bn.startsWith(b+' '))) return {company:'P&G', via:'registry'};
  return {company:null, via:null};
}

/* ───────────── Token + fetch ───────────── */
const getToken = () => localStorage.getItem('pg_asana_pat') || '';
function saveToken(){ const t=document.getElementById('pat').value.trim(); if(!t) return; localStorage.setItem('pg_asana_pat',t); document.getElementById('token-screen').style.display='none'; loadAll(); }
function clearToken(){ localStorage.removeItem('pg_asana_pat'); document.getElementById('token-screen').style.display='flex'; }
async function asana(path, params={}) {
  const u=new URL(ASANA+path); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u,{headers:{Authorization:'Bearer '+getToken(),Accept:'application/json'}});
  if (r.status===401){ clearToken(); throw new Error('Invalid token'); }
  if (!r.ok) throw new Error('Asana '+r.status);
  return r.json();
}
async function asanaAll(path, params) { let out=[], off; do { const d=await asana(path, off?{...params,offset:off}:params); out=out.concat(d.data||[]); off=d.next_page?.offset; } while(off); return out; }

/* ───────────── Dates ───────────── */
const DAY=86400000;
const d0 = s => new Date(s.slice(0,10)+'T00:00:00');
const today = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
const addDays = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); r.setHours(0,0,0,0); return r; };
const diffDays = (a,b) => Math.round((b-a)/DAY);
const fmt = d => d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—';
const fmtY = d => d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

/* ───────────── State ───────────── */
let TEMPLATES = {}; let brands = []; let selected = null; let view='summary';

/* ───────────── Load ───────────── */
async function loadAll() {
  if (!getToken()) { document.getElementById('token-screen').style.display='flex'; return; }
  const L=document.getElementById('loading'), M=document.getElementById('loading-msg');
  L.style.display='flex'; ['summary','brand','roadmap'].forEach(v=>document.getElementById('view-'+v).hidden=true);
  try {
    M.textContent='Loading templates…';
    const idx = await (await fetch('templates/index.json')).json();
    for (const t of idx) TEMPLATES[t.id] = await (await fetch(`templates/${t.id}.json`)).json();

    M.textContent='Loading Onboarding 2026 from Asana…';
    const OPT='name,notes,parent.name,completed,completed_at,created_at,assignee.name,permalink_url,custom_fields.gid,custom_fields.name,custom_fields.display_value,custom_fields.text_value';
    const all = (await Promise.all(SECTIONS.map(async s => (await asanaAll(`/sections/${s.id}/tasks`,{opt_fields:OPT,limit:100})).map(t=>({...t,_sec:s}))))).flat();
    const pg = all.filter(t => parentCompany(t).company==='P&G');

    M.textContent=`Loading stage history for ${pg.length} P&G brands…`;
    await Promise.all(pg.map(async t => {
      const stories = await asanaAll(`/tasks/${t.gid}/stories`,{opt_fields:'resource_subtype,text,created_at',limit:100});
      t._moves = [{date:d0(t.created_at), stage:'Signed – Day 0 Setup'}];
      for (const s of stories) if (s.resource_subtype==='section_changed') { const m=/to "([^"]+)"|to '([^']+)'/.exec(s.text||''); if (m) t._moves.push({date:d0(s.created_at), stage:m[1]||m[2]}); }
    }));
    brands = pg.map(buildBrand).sort((a,b)=>a.anchor-b.anchor);
    document.getElementById('meta').textContent = `${brands.length} P&G brands of ${all.length} in Onboarding 2026 · updated ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;
    if (!selected && brands.length) selected = brands[0].gid;
    L.style.display='none'; render();
  } catch(e) { M.innerHTML=`<span style="color:#ef4444">Failed: ${esc(e.message)}</span>`; }
}

function pickTemplate(brandType) {
  const bt=(brandType||'').toLowerCase();
  for (const id of TEMPLATE_PRIORITY) if (TEMPLATES[id].asanaBrandTypes.some(k=>bt.includes(k))) return {tpl:TEMPLATES[id], assumed:false};
  return {tpl:TEMPLATES['3p-new-shop'], assumed:true};
}
function buildBrand(t) {
  const name=cf(t,CF.brandName)||t.name, brandType=cf(t,CF.brandType)||'', ds=cf(t,CF.dateSigned);
  const anchor = ds ? d0(ds) : d0(t.created_at);
  const {tpl,assumed}=pickTemplate(brandType);
  const steps = tpl.steps.map(s=>({...s, start:addDays(anchor,s.startOffset), due:addDays(anchor,s.dueOffset)}));
  const goLive = addDays(anchor, tpl.plannedDurationDays-1);
  const live = t.completed && t._sec.live, blocked=t._sec.blocked, churned=t._sec.churned;
  const tdy=today(); const inStage = Math.max(0, diffDays(t._moves[t._moves.length-1].date, tdy));
  const health = churned?{k:'gray',l:'Churned'} : live?{k:'ok',l:'Live'} : blocked?{k:'bad',l:'Blocked'} : tdy>goLive?{k:'bad',l:'Behind plan'} : diffDays(tdy,goLive)<=7?{k:'warn',l:'Due this week'} : {k:'ok',l:'On plan'};
  return { gid:t.gid, name, brandType, salesRep:cf(t,CF.salesRep)||'—', ops:t.assignee?.name||'—', blockerOwner:cf(t,CF.blockerOwner)||null,
           signed:ds?d0(ds):null, anchor, stage:t._sec.name, step:t._sec.step, live, blocked, churned, inStage, moves:t._moves, permalink:t.permalink_url,
           tpl, assumed, steps, goLive, health, via:parentCompany(t).via, daysElapsed:diffDays(anchor,tdy) };
}

/* ───────────── Views ───────────── */
function showView(v){ view=v; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===v)); render(); }
function render(){ ['summary','brand','roadmap'].forEach(v=>document.getElementById('view-'+v).hidden=(v!==view)); ({summary:renderSummary,brand:renderBrand,roadmap:renderRoadmap})[view](); }

function renderSummary() {
  const el=document.getElementById('view-summary');
  if (!brands.length) { el.innerHTML='<div class="empty">No P&amp;G brands found in Onboarding 2026.</div>'; return; }
  const n=brands.length, live=brands.filter(b=>b.live).length, blocked=brands.filter(b=>b.blocked).length, active=brands.filter(b=>!b.live&&!b.churned).length, behind=brands.filter(b=>b.health.l==='Behind plan').length;
  el.innerHTML = `
    <div class="cards">
      <div class="card"><div class="lbl">P&amp;G brands</div><div class="val" style="color:var(--accent)">${n}</div><div class="sub">in Onboarding 2026</div></div>
      <div class="card"><div class="lbl">Live</div><div class="val" style="color:var(--ok)">${live}</div><div class="sub">final check / live</div></div>
      <div class="card"><div class="lbl">In pipeline</div><div class="val">${active}</div><div class="sub">not yet live</div></div>
      <div class="card"><div class="lbl">Blocked</div><div class="val" style="color:var(--bad)">${blocked}</div><div class="sub">waiting / blocked</div></div>
      <div class="card"><div class="lbl">Behind plan</div><div class="val" style="color:${behind?'var(--bad)':'var(--ok)'}">${behind}</div><div class="sub">past planned go-live</div></div>
    </div>
    <div class="panel"><h2>Brand status <span style="text-transform:none;letter-spacing:0;color:#94a3b8">(click a row for the timeline)</span></h2>
    <div style="overflow-x:auto"><table><thead><tr><th>Brand</th><th>Type</th><th>Current stage</th><th>Days in stage</th><th>Health</th><th>Signed</th><th>Planned go-live</th><th>Day</th><th>Ops</th><th>Sales rep</th><th>Blocker</th></tr></thead><tbody>
    ${brands.map(b=>`<tr class="click" onclick="selected='${b.gid}';showView('brand')">
      <td><b>${esc(b.name)}</b></td><td>${esc(b.brandType||'—')}${b.assumed?' <span class="pill warn" title="No Brand Type in Asana; 3P New Shop template assumed">?</span>':''}</td>
      <td>${b.live?'✅ ':b.blocked?'🔴 ':''}${esc(b.stage)}</td><td>${b.inStage}d</td>
      <td><span class="pill ${b.health.k}">${b.health.l}</span></td><td>${fmt(b.signed)}</td><td>${fmt(b.goLive)}</td>
      <td>${b.daysElapsed} / ${b.tpl.plannedDurationDays}</td><td>${esc(b.ops)}</td><td>${esc(b.salesRep)}</td><td>${b.blockerOwner?`<span class="pill bad">${esc(b.blockerOwner)}</span>`:'—'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}

function renderBrand() {
  const el=document.getElementById('view-brand'); const b=brands.find(x=>x.gid===selected)||brands[0];
  if (!b) { el.innerHTML='<div class="empty">No P&amp;G brands found.</div>'; return; }
  const tdy=today(); const first=b.tpl.categories[0];
  const from=addDays(b.anchor,-2), to=addDays(new Date(Math.max(b.goLive, tdy)), 5), days=diffDays(from,to)+1, DW=22;
  const col = d => Math.max(0, diffDays(from,d));
  // header rows: months + days
  let months='', dayCells='', prev=''; for (let i=0;i<days;i++){ const d=addDays(from,i); const m=d.toLocaleDateString('en-US',{month:'short'}); months+=`<div class="g-head month">${m!==prev?m:''}</div>`; prev=m; dayCells+=`<div class="g-head" style="${d.getDay()%6===0?'background:#f1f5f9':''}">${d.getDate()}</div>`; }
  const gridCols = `grid-template-columns: 340px repeat(${days}, ${DW}px)`;
  const bar = (s,e,cls,label,title) => `<div class="g-bar ${cls}" title="${esc(title)}" style="left:${col(s)*DW}px;width:${Math.max(1,diffDays(s,e)+1)*DW-2}px">${esc(label)}</div>`;
  const todayLine = `<div class="g-today" style="left:${(col(tdy)+.5)*DW}px"></div>`; const todayLbl = todayLine.replace('g-today','g-today lbl');
  // actual (Asana) track
  const moves=b.moves; let actual='';
  moves.forEach((m,i)=>{ const end = i+1<moves.length ? addDays(moves[i+1].date,-1) : (b.live ? moves[i].date : tdy); const cls = /live/i.test(m.stage)?'live':/block/i.test(m.stage)?'blocked':''; actual += bar(m.date, new Date(Math.max(end,m.date)), 'actual '+cls, m.stage, `${m.stage}: ${fmt(m.date)} → ${fmt(end)}`); });
  let rows = `<div class="g-cell g-left g-cat">Actual — Asana stage history</div><div class="g-track" style="grid-column:2 / span ${days};--day:${DW}px">${actual}${todayLbl}</div>`;
  // planned steps by category
  for (const cat of b.tpl.categories) {
    rows += `<div class="g-cell g-left g-cat">${esc(cat)}${cat===first?' <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#64748b">· tracked in Asana</span>':''}</div><div class="g-track g-cat" style="grid-column:2 / span ${days};--day:${DW}px">${todayLine}</div>`;
    for (const s of b.steps.filter(s=>s.category===cat)) {
      const ownerCls = s.owner==='Pattern'?'Pattern':s.owner==='Brand'?'Brand':'Both';
      const state = b.live ? 'done' : s.due<tdy ? 'late' : s.start>tdy ? 'future' : 'now';
      rows += `<div class="g-cell g-left" title="${esc(s.task)}"><span style="color:#94a3b8;font-size:11px;margin-right:6px">${s.action}</span><span class="owner ${ownerCls}" style="margin-right:6px">${esc(s.owner)}</span>${esc(s.task)}</div>
               <div class="g-track" style="grid-column:2 / span ${days};--day:${DW}px">${bar(s.start,s.due,`${ownerCls} ${state==='future'?'future':''} ${state==='late'?'late':''}`, `${s.days}d`, `${s.task}\n${fmt(s.start)} → ${fmt(s.due)} (${s.days}d) · ${s.owner}${state==='late'?' · past planned due date':''}`)}${todayLine}</div>`;
    }
  }
  el.innerHTML = `
    <div class="panel"><div class="brand-head">
      <div><div class="kv">Brand</div><select class="brand-sel" onchange="selected=this.value;render()">${brands.map(x=>`<option value="${x.gid}" ${x.gid===b.gid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="kv">Type<b>${esc(b.brandType||'—')}</b></div>
      <div class="kv">Template<b>${esc(b.tpl.label)}${b.assumed?' <span class="pill warn">assumed</span>':''}</b></div>
      <div class="kv">Current stage<b>${b.live?'✅ ':b.blocked?'🔴 ':''}${esc(b.stage)} <span style="color:#64748b;font-weight:400">· ${b.inStage}d</span></b></div>
      <div class="kv">Health<b><span class="pill ${b.health.k}">${b.health.l}</span></b></div>
      <div class="kv">Signed<b>${fmtY(b.signed)}</b></div>
      <div class="kv">Planned go-live<b>${fmtY(b.goLive)} <span style="color:#64748b;font-weight:400">· day ${b.daysElapsed} of ${b.tpl.plannedDurationDays}</span></b></div>
      <div class="kv">Ops / Sales<b>${esc(b.ops)} / ${esc(b.salesRep)}</b></div>
      <div style="margin-left:auto;display:flex;gap:8px;align-self:center">
        ${b.tpl.externalDoc?`<a class="btn" style="background:#fff;color:#1e293b;border-color:#e2e8f0" target="_blank" href="${b.tpl.externalDoc}">📄 External doc</a>`:''}
        <a class="btn orange" target="_blank" href="${b.permalink}">↗ Open in Asana</a>
      </div>
    </div></div>
    <div class="panel"><h2>Timeline · ${esc(b.tpl.title)}</h2>
      <div class="gantt"><div class="g-grid" style="${gridCols}">
        <div class="g-head g-left" style="grid-row:1 / span 2;background:#f8fafc;text-align:left;padding-left:10px;line-height:44px">Step · owner</div>${months}${dayCells}${rows}
      </div></div>
      <div class="legend"><span><i style="background:var(--pattern)"></i>Pattern</span><span><i style="background:var(--brand)"></i>Brand</span><span><i style="background:var(--both)"></i>Pattern/Brand</span><span><i style="background:#0f172a"></i>Actual Asana stage</span><span><i style="border:2px solid var(--bad);background:#fff"></i>Past planned due, not confirmed</span><span><i style="background:var(--pattern);opacity:.45"></i>Future</span></div>
      <p style="color:#64748b;font-size:12px;margin:10px 0 0">Planned dates come from the ${esc(b.tpl.label)} template anchored on the Date Signed. Detected as P&amp;G via ${esc(b.via)}.</p>
    </div>`;
}

function renderRoadmap() {
  const el=document.getElementById('view-roadmap');
  if (!brands.length) { el.innerHTML='<div class="empty">No P&amp;G brands found.</div>'; return; }
  const tdy=today(); const from=addDays(new Date(Math.min(...brands.map(b=>b.anchor))),-3), to=addDays(new Date(Math.max(tdy,...brands.map(b=>b.goLive))),7);
  const days=diffDays(from,to)+1, DW=Math.max(6, Math.min(22, Math.floor(1200/days)));
  const col=d=>Math.max(0,diffDays(from,d));
  let weeks=''; for (let i=0;i<days;i++){ const d=addDays(from,i); weeks+=`<div class="g-head" style="font-size:9.5px">${d.getDay()===1?fmt(d):''}</div>`; }
  const rows = brands.map(b=>{
    const end = b.live ? b.moves[b.moves.length-1].date : tdy;
    const plan=`<div class="g-bar ${b.live?'':'future'}" style="left:${col(b.anchor)*DW}px;width:${(diffDays(b.anchor,b.goLive)+1)*DW-2}px;background:#c7d2fe;color:#1e293b" title="Planned: ${fmt(b.anchor)} → ${fmt(b.goLive)}">plan · go-live ${fmt(b.goLive)}</div>`;
    const act=`<div class="g-bar actual ${b.live?'live':b.blocked?'blocked':''}" style="left:${col(b.anchor)*DW}px;width:${Math.max(1,diffDays(b.anchor,end)+1)*DW-2}px;top:5px;height:9px;line-height:9px;font-size:0" title="Actual: ${fmt(b.anchor)} → ${fmt(end)} · ${b.stage}"></div>`;
    return `<div class="g-cell g-left" style="cursor:pointer" onclick="selected='${b.gid}';showView('brand')"><b>${esc(b.name)}</b> <span style="color:#64748b">· ${esc(b.stage)}</span> <span class="pill ${b.health.k}" style="margin-left:6px">${b.health.l}</span></div>
            <div class="g-track" style="grid-column:2 / span ${days};--day:${DW}px;height:30px">${plan}${act}<div class="g-today ${b===brands[0]?'lbl':''}" style="left:${(col(tdy)+.5)*DW}px"></div></div>`;
  }).join('');
  el.innerHTML = `<div class="panel"><h2>All P&amp;G brands · planned vs actual</h2>
    <div class="gantt"><div class="g-grid" style="grid-template-columns:340px repeat(${days},${DW}px)">
      <div class="g-head g-left" style="text-align:left;padding-left:10px">Brand · stage</div>${weeks}${rows}</div></div>
    <div class="legend"><span><i style="background:#c7d2fe"></i>Planned window (template)</span><span><i style="background:#0f172a"></i>Actual elapsed (Asana)</span><span><i style="background:var(--ok)"></i>Live</span><span><i style="background:var(--bad)"></i>Blocked</span></div></div>`;
}

/* ───────────── Boot ───────────── */
if (!getToken()) document.getElementById('token-screen').style.display='flex'; else loadAll();
</script>
</body>
</html>
